actions:
  openapiHarvested: 0
  apisYmlApis: 0
  apisYmlUpdated: true
  reason: >-
    apis[] is intentionally empty. Sun Life exposes no public, documented API,
    so listing one would fabricate a surface that does not exist. Sun Life Link,
    Sun Life Connect and the member portals are recorded in common[] as company
    properties, and the partner-gated posture is documented here.
