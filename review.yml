aid: sun-life
name: Sun Life
review:
  question: >-
    Does Sun Life publish a public, self-serve developer portal or downloadable
    API definitions for any of its insurance lines?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: carrier-life-health
findings:
  summary: |
    Sun Life has no public developer portal and no downloadable API
    definitions in any of its markets. Every candidate developer host was
    probed on 2026-07-25 and none resolves in DNS: developer.sunlife.com,
    developers.sunlife.com, docs.sunlife.com, api.sunlife.com, apis.sunlife.com,
    gateway.sunlife.com, partner(s).sunlife.com, and the same set under
    sunlife.ca all return NXDOMAIN. The path probes www.sunlife.com/developers,
    /developer, /partners and /integrations all return HTTP 404.

    The one vanity path that does resolve is www.sunlife.com/api, which 302s to
    the Sun Life U.S. "Digital capabilities" marketing page for employers
    (HTTP 200 with a browser user agent; HTTP 403 to a bare curl because the
    site sits behind Akamai/DataDome bot protection). That page is category (c)
    in the portal taxonomy: marketing, not reference documentation.

    Sun Life's only named API surface is Sun Life Link, described on its own
    product page as "our API solution" that "streamlines benefits
    administration through real-time data exchanges with the HR platforms you
    use every day," and stating that "Sun Life develops industry leading APIs
    and deep partnerships with HR platforms." It is a partner-integration
    program in U.S. group benefits, not an API a developer can sign up for.
    Named platform connections and their live capabilities, verbatim from the
    page: Workday (EOI, Billing, Absence — create and update leave, intermittent
    leave, return-to-work and leave consolidation; Plan Setup and Enrollment via
    Workday Wellness listed as Q4), ADP Workforce Now (EOI, Plan Setup,
    self-bill available; Enrollment in early adopter), ADP Vantage HCM /
    Health & Welfare Service Engine / ADP Lyric HCM (EOI, Plan Setup;
    Enrollment a future enhancement), UKG Pro Benefits Administration (EOI),
    PlanSource (EOI), Employee Navigator (Plan Setup available, EOI future),
    bswift (EOI), plus "general connectivity with 150 + other HR platforms."

    Sun Life publishes two public PDFs about API connectivity — a "Connectivity
    101" whitepaper and an "API questions to ask during the RFP process"
    one-pager. Both are buyer-education thought leadership aimed at brokers and
    HR leaders, and both confirm the gating: they instruct the reader to ask
    carriers "Are the APIs offered to all clients, or only a subset based on
    certain criteria like client size, plan type," "What are the specific costs
    associated with using the available APIs? Can you provide a breakdown of
    pricing per API?" and "What is the typical timeline and process to get the
    APIs activated and integrated for a new client?" Neither document contains
    a base URL, an endpoint, an auth scheme, or a link to reference docs.

    Everything else Sun Life ships digitally is a sign-in wall: Sun Life Connect
    (U.S. employer/list-bill administration — employee changes, EOI, billing,
    payments, claims submission and status) at login.sunlifeconnect.com, the
    U.S. member account, mysunlife.ca in Canada, and connect.sunlife.ca, a
    Salesforce Experience Cloud community serving the Canadian advisor and
    Lumino Health audiences. No Sun Life GitHub organization exists
    (api.github.com/orgs/sunlife, sun-life, sunlifefinancial, SunLifeFinancial
    all 404).

    This is the expected shape for a Canadian life and health carrier. OSFI
    supervises Sun Life prudentially while FSRA, the AMF and the other
    provincial regulators handle market conduct; Canada has no open-insurance
    mandate and Consumer-Driven Banking explicitly excludes insurance, so there
    is no regulatory forcing function producing a public API. The pull that
    does exist comes from the U.S. group-benefits BenTech ecosystem, and Sun
    Life answers it with negotiated platform partnerships rather than an open
    developer program.
  developerPortal:
    url: ''
    confirmed: false
    classification: none
    note: >-
      No developer portal exists. The closest first-party surface is the Sun Life
      U.S. "Digital capabilities" / "Sun Life Link" marketing pages, classified
      as (c) marketing "innovation" page. Gated.
  acordPosture:
    posture: no ACORD reference found
    detail: >-
      No occurrence of ACORD, AL3, ACORD XML, NGDS, IVANS, agency download,
      Applied Epic or Vertafore AMS360 was found on any fetched Sun Life page or
      in either public API whitepaper. Sun Life is a life/health and group
      benefits carrier rather than a P&C carrier distributing through
      independent agencies, so the ACORD/IVANS agency-download rail does not
      apply to it. Its connectivity vocabulary is generic: the Connectivity 101
      whitepaper frames the choice as "Comparing EDI and API connectivity,"
      where EDI means "an ongoing file that is generally sent weekly to pass
      one-way batch data across platforms" versus APIs that "allow automated,
      real-time data" exchange. No standards body — not ACORD, and not LIMRA/LDEx
      which would be the group-benefits analogue — is named anywhere.
  insuranceVerbs:
    quote:
      exposed: false
      note: No public or documented quoting API.
    bind:
      exposed: false
      note: No public or documented bind API.
    issue:
      exposed: partner-only
      note: >-
        The nearest equivalent is Sun Life Link's Plan Setup, Enrollment and
        Evidence of Insurability (EOI) exchanges with HR/benefits-admin
        platforms. Partner-only, per-client contracted, undocumented publicly.
    fnol:
      exposed: false
      note: >-
        Claims are submitted and tracked through the login-gated Sun Life
        Connect employer portal and the member account. Absence and disability
        leave data does move over Sun Life Link (create/update leave,
        intermittent leave, return-to-work), but only partner-to-partner. No
        public FNOL API.
    audience: partner-only (HR and benefits-administration platforms)
  authModel:
    publicScheme: none documented
    note: >-
      No public API means no published auth scheme. No OIDC or OAuth discovery
      document is served: www.sunlife.com/.well-known/openid-configuration
      returns 404, login.sunlifeconnect.com and account.sunlifeconnect.com
      return 500, and www.sunlife.ca/.well-known/openid-configuration returns
      403 behind DataDome. Human authentication is session sign-in at
      login.sunlifeconnect.com (U.S.) and Salesforce Experience Cloud login at
      connect.sunlife.ca (Canada).
  webhooks:
    found: false
    note: No event catalog, webhook documentation or AsyncAPI definition found.
  postman:
    found: false
    note: No public Postman collection or workspace found.
  graphql:
    found: false
    note: No public /graphql surface found on any resolving Sun Life host.
  grpc:
    found: false
    note: No published .proto files found.
  openapi:
    harvested: false
    specsCount: 0
    note: >-
      No OpenAPI or Swagger document exists to harvest. www.sunlife.com
      /openapi.json, /swagger.json and /api-docs all return HTTP 404, and
      services.sunlife.com returns 404 for the same paths.
transports:
  - protocol: REST
    scheme: https
    documented: false
    note: >-
      Sun Life Link is described as an API-based real-time data exchange with HR
      platforms, but no base URL, endpoint, media type or version is published.
  - protocol: EDI (batch file)
    documented: false
    note: >-
      The Connectivity 101 whitepaper confirms weekly one-way batch EDI files
      remain the incumbent group-benefits eligibility rail alongside Sun Life
      Link APIs. No file layout, transport host or standard is published.
  - protocol: GraphQL
    documented: false
    note: Not found.
  - protocol: WebSocket
    documented: false
    note: Not found.
