name: Sun Life
kind: company
description: 'Sun Life Financial Inc. is a Canadian multinational life and health insurer and asset manager
  headquartered in Toronto, one of the "life trio" that dominates Canada''s insurance market alongside
  Manulife and Great-West Lifeco. Sun Life writes individual life insurance, individual and group health
  and dental coverage, group benefits, disability and absence management, annuities and retirement products,
  and runs a large wealth business through Sun Life Global Investments, SLC Management and MFS Investment
  Management, with operations across Canada, the United States, the United Kingdom, Ireland and Asia.
  In the United States it is a leading group benefits, stop-loss and dental carrier and owns DentaQuest.
  Sun Life publishes no developer portal under its own brand: its only named Sun Life API surface is Sun
  Life Link, a partner-gated benefits-connectivity program that exchanges evidence of insurability, plan
  setup, enrollment, billing and absence data with HR and benefits-administration platforms including
  Workday, ADP, UKG, PlanSource, Employee Navigator and bswift, negotiated per client rather than signed
  up for. The public, machine-readable APIs in the Sun Life group belong to DentaQuest, its U.S. dental
  subsidiary, which runs an Azure API Management developer portal at developers.dentaquest.com publishing
  three OpenAPI 3.0.1 definitions: a SMART-on-FHIR Patient Access API, a Da Vinci PDex Plan-Net Provider
  Directory API and an anonymous FHIR CapabilityStatement endpoint, all released under the CMS Interoperability
  and Patient Access Final Rule (CMS-9115-F) and served for both the DentaQuest and Delta Dental of Massachusetts
  brands. Canada''s supervisory split between OSFI and the provincial conduct regulators, and the exclusion
  of insurance from Consumer-Driven Banking, means no open-insurance mandate creates a forcing function
  for a public Sun Life API in its home market; the U.S. CMS mandate is what produced the only public
  one.'
