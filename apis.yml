- aid: sun-life-dentaquest-fhir-provider-directory
  name: DentaQuest FHIR Provider Directory API
  description: FHIR R4 (4.0.1) Provider Directory API from DentaQuest, the Sun Life U.S. dental company,
    conforming to the HL7 Da Vinci PDex Plan-Net Implementation Guide 1.1.0 and published under CMS-9115-F.
    Exposes read and search over Practitioner, PractitionerRole, Organization, Location, HealthcareService,
    InsurancePlan and Endpoint, each with _history and version reads, so third-party applications can
    find in-network dentists and dental plans. Authenticated with an Azure API Management subscription
    key sent in the Ocp-Apim-Subscription-Key header or the subscription-key query parameter. Errors return
    a FHIR OperationOutcome. The same API is served for the Delta Dental of Massachusetts brand.
  humanURL: https://developers.dentaquest.com/apis
  baseURL: https://api.dentaquest.com/FhirProviderDirectory
