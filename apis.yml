apis:
- aid: sun-life-dentaquest-fhir-patient-access
  name: DentaQuest FHIR Patient Access API
  description: FHIR R4 (4.0.1) read-only Patient Access API from DentaQuest, the Sun Life U.S. dental
    company, published under the CMS Interoperability and Patient Access Final Rule (CMS-9115-F). Third-party
    applications authorize a member with SMART App Launch 1.0.0 (authorization code + PKCE S256, scopes
    patient/*.read, launch/patient, offline_access, openid, fhirUser) against an Okta CIAM authorization
    server, then read that member's Patient, Coverage, Organization, Practitioner and RelatedPerson resources,
    including _history and version reads. Conforms to HL7 US Core (3.1.1, 6.1.0 and 7.0.0-ballot instantiated
    in the CapabilityStatement). Errors return a FHIR OperationOutcome. The same API is served for the
    Delta Dental of Massachusetts brand.
  humanURL: https://developers.dentaquest.com/apis
  baseURL: https://api.dentaquest.com/FhirPatientAccess/v1
  tags:
  - FHIR
  - Patient Access
  - SMART on FHIR
  - Dental
  - CMS Mandate
  - Health Data
  - OAuth
