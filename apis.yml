- aid: sun-life-dentaquest-fhir-metadata
  name: DentaQuest FHIR Metadata API
  description: Anonymous FHIR R4 conformance endpoint for the DentaQuest (Sun Life U.S.) interoperability
    platform. A single GET /metadata operation returns the CapabilityStatement of the underlying Azure
    Healthcare APIs FHIR server (software version 4.0.815), listing every supported resource type, interaction
    and search parameter in application/json or application/xml. Requires no credentials and is served
    on both api.dentaquest.com and api.deltadentalma.com.
  humanURL: https://developers.dentaquest.com/apis
  baseURL: https://api.dentaquest.com/fhirmetadata
