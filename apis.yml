name: Sun Life
kind: company
description: >-
  Sun Life Financial Inc. is a Canadian multinational life and health insurer and
  asset manager headquartered in Toronto, one of the "life trio" that dominates
  Canada's insurance market alongside Manulife and Great-West Lifeco. Sun Life
  writes individual life insurance, individual and group health and dental
  coverage, group benefits, disability and absence management, annuities and
  retirement products, and runs a large wealth business through Sun Life Global
  Investments, SLC Management and MFS Investment Management, with operations
  across Canada, the United States, the United Kingdom, Ireland and Asia. In the
  United States it is a leading group benefits, stop-loss and dental carrier and
  owns DentaQuest. Sun Life publishes no public, self-serve developer portal and
  no downloadable OpenAPI definitions in any market. Its only named API surface is
  Sun Life Link, a partner-gated benefits-connectivity program that exchanges
  evidence of insurability, plan setup, enrollment, billing and absence data in
  real time with HR and benefits-administration platforms including Workday, ADP,
  UKG, PlanSource, Employee Navigator and bswift; access is negotiated per client
  and per platform rather than signed up for. Every other Sun Life digital surface
  — Sun Life Connect for employers, the member account, the Canadian advisor and
  Lumino Health communities — sits behind a sign-in wall. Canada's supervisory
  split between OSFI (prudential) and the provincial conduct regulators, and the
  exclusion of insurance from Consumer-Driven Banking, means there is no
  open-insurance mandate creating any forcing function for a public API here.
